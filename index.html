<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CET-6 全流程学习</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1a2233;
    --muted: #667085;
    --line: #e4e8f0;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --up: #16a34a;
    --down: #98a2b3;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1116;
      --card: #171b22;
      --text: #e6e9ef;
      --muted: #9aa4b2;
      --line: #262c36;
      --accent: #818cf8;
      --accent-soft: #1e2235;
      --up: #4ade80;
      --down: #6b7280;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --card: #171b22; --text: #e6e9ef; --muted: #9aa4b2;
    --line: #262c36; --accent: #818cf8; --accent-soft: #1e2235;
    --up: #4ade80; --down: #6b7280; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 48px 16px 72px; }

  header { text-align: center; margin-bottom: 40px; }
  header .logo { font-size: 44px; line-height: 1; }
  header h1 { font-size: 28px; margin: 12px 0 6px; letter-spacing: .5px; }
  header p { color: var(--muted); margin: 0; font-size: 15px; }
  .hint {
    margin: 20px auto 0; max-width: 640px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 10px; padding: 10px 16px; font-size: 13.5px;
  }
  .hint code {
    background: transparent; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12.5px; border: 1px solid currentColor; border-radius: 5px; padding: 0 5px;
    opacity: .9;
  }
  .statusbar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 16px auto 0; max-width: 640px;
    border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 600;
    background: var(--card); border: 1px solid var(--line); color: var(--down);
  }
  .statusbar .sdot { width: 10px; height: 10px; border-radius: 50%; background: var(--down); flex: none; }
  .statusbar[data-state="on"] { color: var(--up); border-color: color-mix(in srgb, var(--up) 35%, var(--line)); }
  .statusbar[data-state="on"] .sdot { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 20%, transparent); }
  .statusbar[data-state="partial"] { color: #d97706; }
  .statusbar[data-state="partial"] .sdot { background: #d97706; }

  section { margin-top: 40px; }
  .sec-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 600; margin: 0 0 16px;
  }
  .sec-title .tag {
    font-size: 12px; font-weight: 500; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px;
  }

  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; box-shadow: var(--shadow);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  a.card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 6px 24px rgba(79,70,229,.14); }
  .card .emoji { font-size: 28px; line-height: 1; }
  .card .name { font-size: 16px; font-weight: 600; margin: 12px 0 4px; }
  .card .desc { font-size: 13px; color: var(--muted); margin: 0 0 14px; min-height: 2.6em; }
  .card .meta { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
  .card .port { color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--down); flex: none; }
  .status.on { color: var(--up); } .status.on .dot { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 20%, transparent); }
  .status.off { color: var(--down); }

  .offline-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .note {
    margin-top: 14px; font-size: 12.5px; color: var(--muted);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .note a { color: var(--accent); text-decoration: none; }
  .note a:hover { text-decoration: underline; }

  footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 56px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🎓</div>
    <h1>CET-6 全流程学习</h1>
    <p>大学英语六级备考 · 翻译 / 写作</p>
    <div class="statusbar" id="statusBar" data-state="off">
      <span class="sdot"></span>
      <span id="statusText">检测服务状态中…</span>
    </div>
    <div class="hint">
      双击桌面「CET6学习」图标启动服务，关闭该 App 即自动停止全部服务。
      状态每 5 秒自动刷新。
    </div>
  </header>

  <section>
    <h2 class="sec-title">📚 在线训练 <span class="tag">需启动服务</span></h2>
    <div class="grid" id="appGrid"></div>
  </section>

  <section>
    <h2 class="sec-title">📜 历史记录 <span class="tag">需启动服务</span></h2>
    <a class="card" href="http://127.0.0.1:5559/history">
      <div class="emoji">📜</div>
      <div class="name">历史记录</div>
      <div class="desc">查看翻译 / 写作中提交过的所有记录（题目 · 作答 · 得分 · 批改）。</div>
      <div class="meta"><span class="port">:5559/history</span><span class="status"><span class="dot"></span>打开</span></div>
    </a>
  </section>

  <footer>本地个人学习工具 · 服务仅监听 127.0.0.1，不会暴露到公网</footer>
</div>

<script>
  const APPS = [
    { emoji: "🌐", name: "翻译", desc: "段落汉译英，AI 评分批改。", port: 5559 },
    { emoji: "✍️", name: "写作", desc: "命题作文，AI 评分与润色。", port: 5560 },
  ];

  const grid = document.getElementById("appGrid");

  APPS.forEach((app, i) => {
    const el = document.createElement("a");
    el.className = "card";
    el.href = `http://127.0.0.1:${app.port}`;
    el.innerHTML = `
      <div class="emoji">${app.emoji}</div>
      <div class="name">${app.name}</div>
      <div class="desc">${app.desc}</div>
      <div class="meta">
        <span class="port">:${app.port}</span>
        <span class="status off" data-idx="${i}"><span class="dot"></span>检测中…</span>
      </div>`;
    grid.appendChild(el);
  });

  // 用 no-cors fetch 探测端口是否可达（能连上即“运行中”，连不上即“未启动”）
  const states = [];
  function check(i, url) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 3000);
    fetch(url, { mode: "no-cors", signal: ctrl.signal })
      .then(() => set(i, true))
      .catch(() => set(i, false))
      .finally(() => clearTimeout(timer));
  }
  function set(i, on) {
    const st = document.querySelector(`.status[data-idx="${i}"]`);
    if (!st) return;
    st.className = `status ${on ? "on" : "off"}`;
    st.lastChild.textContent = on ? " 运行中" : " 未启动";
    states[i] = on;
    updateBanner();
  }
  function updateBanner() {
    const bar = document.getElementById("statusBar");
    const txt = document.getElementById("statusText");
    if (!bar || !txt) return;
    const n = states.filter(v => v === true).length;
    if (n === APPS.length) {
      bar.dataset.state = "on";
      txt.textContent = `服务运行中（${n}/${APPS.length}）`;
    } else if (n === 0) {
      bar.dataset.state = "off";
      txt.textContent = "服务未启动 —— 双击桌面「CET6学习」图标启动";
    } else {
      bar.dataset.state = "partial";
      txt.textContent = `部分服务运行中（${n}/${APPS.length}）`;
    }
  }

  function refresh() {
    APPS.forEach((app, i) => check(i, `http://127.0.0.1:${app.port}/`));
  }
  refresh();
  setInterval(refresh, 5000);   // 每 5 秒自动刷新状态
</script>
</body>
</html>
